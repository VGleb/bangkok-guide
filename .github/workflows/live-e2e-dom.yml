name: Bangkok live E2E DOM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'map.js'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/live-e2e-dom.yml'

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    env:
      FEEDBACK_API_TOKEN: ${{ secrets.FEEDBACK_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for live site
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error https://vgleb.github.io/bangkok-guide/ | grep -q './app.js?v=28'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Run live DOM regression
        run: |
          node --input-type=module <<'NODE'
          import { webkit } from 'playwright';

          const token = process.env.FEEDBACK_API_TOKEN;
          const url = 'https://vgleb.github.io/bangkok-guide/';
          const browser = await webkit.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 3,
            isMobile: true,
            hasTouch: true
          });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          const assert = (v, message) => { if (!v) throw new Error(message); };

          try {
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30_000 });
            await page.locator('#search').waitFor({ state: 'visible', timeout: 15_000 });
            await page.evaluate(value => localStorage.setItem('bangkok-feedback-token-v1', value), token);

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 30_000 });
            await page.locator('#search').waitFor({ state: 'visible', timeout: 15_000 });
            await page.waitForFunction(
              () => document.querySelector('#cloudBrief')?.textContent?.includes('Сохранено'),
              { timeout: 20_000 }
            );

            assert(await page.locator('#hidevisited').evaluate(el => el.classList.contains('active')), 'Hide visited is not enabled by default');
            await page.locator('#hidevisited').click();
            await page.locator('#search').fill('2nd STREET — Siam Discovery');
            await page.waitForTimeout(250);
            const cards = page.locator('#results .card');
            assert(await cards.count() === 1, 'Expected exactly one Siam Discovery card');
            const card = cards.first();
            assert(await card.evaluate(el => el.classList.contains('visited')), 'Siam Discovery is not visited');
            assert(await card.locator('.tag.new').count() === 0, 'Visited Siam Discovery is marked New');

            await page.locator('#search').fill('');
            await page.waitForTimeout(150);
            assert(await page.locator('#results .card').count() > 0, 'Catalog is empty');

            const allChip = page.locator('[data-cat-all]');
            assert(await allChip.evaluate(el => el.classList.contains('active')), 'All categories are not enabled initially');
            assert(await page.locator('[data-cat]:not(.active)').count() === 0, 'Some category is disabled initially');

            const coffee = page.locator('[data-cat="Кофе"]');
            await coffee.click();
            assert(!await coffee.evaluate(el => el.classList.contains('active')), 'Coffee category did not toggle off');
            assert(!await allChip.evaluate(el => el.classList.contains('active')), 'All chip stayed active after disabling a category');
            assert(await page.locator('#results .card').evaluateAll(cards => cards.every(card => ![...card.querySelectorAll('.tag')].some(tag => tag.textContent.trim() === 'Кофе'))), 'Coffee cards remain visible after Coffee was disabled');

            const shops = page.locator('[data-cat="Магазины"]');
            await shops.click();
            assert(!await shops.evaluate(el => el.classList.contains('active')), 'Shops category did not toggle off');
            assert(await page.locator('#results .card').evaluateAll(cards => cards.every(card => ![...card.querySelectorAll('.tag')].some(tag => tag.textContent.trim() === 'Магазины'))), 'Shop cards remain visible after Shops was disabled');

            await allChip.click();
            assert(await allChip.evaluate(el => el.classList.contains('active')), 'All chip did not enable all categories');
            assert(await page.locator('[data-cat]:not(.active)').count() === 0, 'All did not re-enable every category');

            await coffee.click();
            await page.locator('#reset').click();
            assert(await allChip.evaluate(el => el.classList.contains('active')), 'Reset did not enable all categories');
            assert(await page.locator('[data-cat]:not(.active)').count() === 0, 'Reset left a category disabled');
            assert(await page.locator('#hidevisited').evaluate(el => el.classList.contains('active')), 'Reset disabled Hide visited');

            for (let i = 0; i < 3; i++) {
              await page.locator('#viewMap').click();
              await page.waitForFunction(
                () => /мест на карте/.test(document.querySelector('#mapStatus')?.textContent || ''),
                { timeout: 8_000 }
              );
              assert(await page.locator('#mapView').evaluate(el => !el.hidden), 'Map did not open');
              assert(await page.locator('#listView').evaluate(el => el.hidden), 'List stayed visible with map');

              await page.locator('#viewList').click();
              await page.waitForTimeout(100);
              assert(await page.locator('#listView').evaluate(el => !el.hidden), 'Catalog did not reopen');
              assert(await page.locator('#mapView').evaluate(el => el.hidden), 'Map stayed visible after catalog return');
              assert(await page.locator('#results .card').count() > 0, 'Cards disappeared after map round-trip');
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 30_000 });
            await page.locator('#search').waitFor({ state: 'visible', timeout: 15_000 });
            await page.waitForFunction(
              () => document.querySelector('#cloudBrief')?.textContent?.includes('Сохранено'),
              { timeout: 20_000 }
            );

            assert(errors.length === 0, 'Page errors: ' + errors.join(' | '));
            console.log('Mobile WebKit DOM E2E passed');
          } finally {
            await browser.close();
          }
          NODE
